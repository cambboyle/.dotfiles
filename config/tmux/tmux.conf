# =============================================================================
# CORE SETTINGS
# =============================================================================

set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -sg escape-time 10
set -g history-limit 10000

# =============================================================================
# KEYBINDINGS
# =============================================================================

bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind f run-shell "tmux new-window 'sesh connect \$(sesh list -t | fzf --height 40% --reverse --border)'"
set -g popup-style "fg=default,bg=default"
set -g popup-border-style "fg=color8,bg=default"
bind p display-popup -E "ls ~/Projects | fzf --height 40% --reverse --border | xargs -I{} ~/.config/tmux/open-project.sh ~/Projects/{}"
# =============================================================================
# STATUS BAR
# =============================================================================

# All colors come from the terminal's ANSI palette rather than fixed hex, so
# the bar re-themes itself when Ghostty flips between its light and dark
# themes. No reload, no appearance-detection script.
#
#   default   -> terminal's own fg/bg (dark text on light bg, and vice versa)
#   colour0-7 -> theme's normal palette; colour8-15 the bright variants
#   reverse   -> swaps fg/bg, giving a filled badge whose text is always the
#                terminal background, so it stays readable in both modes

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style 'bg=default,fg=default'

# Session name: filled green badge (reverse -> text takes the terminal bg).
set -g status-left "#[fg=colour2,reverse,bold] #S #[default] "
set -g status-left-length 40
set -g status-right "#[fg=colour3] #{cpu_percentage} cpu "
set -g status-right-length 40

# Inactive windows use the terminal fg at reduced intensity rather than
# colour8 — in several light themes bright-black is nearly black, which would
# make inactive windows louder than the active one. `dim` recedes either way.
set -g window-status-format "#[fg=default,dim] #W "
set -g window-status-current-format "#[fg=colour4,reverse,bold] #W #[default]"
set -g window-status-separator " "

set -g pane-border-style 'fg=default,dim'
set -g pane-active-border-style 'fg=colour4'

# Command prompt, messages, and copy-mode selection.
set -g message-style 'bg=default,fg=colour4,bold'
set -g message-command-style 'bg=default,fg=colour4,bold'
set -g mode-style 'reverse'
set -g copy-mode-match-style 'fg=colour3,reverse'
set -g copy-mode-current-match-style 'fg=colour1,reverse'

# =============================================================================
# PLUGINS
# =============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'

# =============================================================================
# PLUGIN CONFIG
# =============================================================================

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# =============================================================================
# TPM INIT — MUST BE LAST LINE
# =============================================================================

run ~/.tmux/plugins/tmux-cpu/cpu.tmux
run '~/.tmux/plugins/tpm/tpm'

# Keybind cheatsheet
bind ? display-popup -E "echo '
  PANES
  prefix + |       split vertical
  prefix + -       split horizontal
  prefix + x       kill pane
  prefix + hjkl    navigate panes
  prefix + HJKL    resize panes

  WINDOWS
  prefix + c       new window
  prefix + &       kill window
  prefix + ,       rename window
  prefix + 1-9     jump to window

  SESSIONS
  prefix + d       detach
  prefix + \$       rename session
  prefix + f       switch session
  prefix + p       open project

  OTHER
  prefix + r       reload config
  prefix + ?       show this help
' | less"

# AFK — jump to afk window
bind a select-window -t dev:afk
