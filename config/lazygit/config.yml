# GUI settings
#
# Theme uses ANSI palette slots + `default` + `reverse` instead of hex, so all
# colors are supplied by whatever Ghostty theme is active. Light/dark follows
# the terminal automatically — nothing here needs to change.
#   default  = terminal's own fg/bg
#   reverse  = swaps fg/bg, so a highlight is always readable in either mode
gui:
  theme:
    activeBorderColor:
      - blue
      - bold
    inactiveBorderColor:
      - default
    searchingActiveBorderColor:
      - cyan
      - bold
    optionsTextColor:
      - blue
    # `reverse` instead of a fixed bg: the selection inverts against the
    # current background, so it reads correctly on Ayu Light and 0x96f alike.
    selectedLineBgColor:
      - reverse
    inactiveViewSelectedLineBgColor:
      - bold
    cherryPickedCommitFgColor:
      - blue
    cherryPickedCommitBgColor:
      - cyan
    markedBaseCommitFgColor:
      - blue
    markedBaseCommitBgColor:
      - yellow
    unstagedChangesColor:
      - red
    defaultFgColor:
      - default
  showIcons: true
  nerdFontsVersion: "3"
  timeFormat: "02 Jan 15:04"
  shortTimeFormat: "15:04"

# Git settings
git:
  paging:
    colorArg: always
    # Wrapper picks delta --light / --dark from the macOS appearance setting.
    pager: ~/.config/lazygit/delta-auto
  commit:
    signOff: false
  branchLogCmd: "git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=medium {{branchName}} --"

# Keybindings
keybinding:
  universal:
    quit: 'q'
    return: '<esc>'
